<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plader</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <div id="app">
        <h1>Plader</h1>

        <!-- Login -->
        <div v-if="!token" id="loginForm">
            <input id="username" v-model="username" placeholder="Brugernavn" @keyup.enter="login">
            <input id="password" type="password" v-model="password" placeholder="Adgangskode" @keyup.enter="login">
            <button id="loginButton" @click="login">Log ind</button>
            <p v-if="loginError" id="loginError" style="color: red">{{ loginError }}</p>
        </div>

        <!-- Logget ind -->
        <div v-else>
            <span id="loggedInAs">Logget ind som {{ currentUser }}</span>
            <button id="logoutButton" @click="logout">Log ud</button>
        </div>

        <!-- Kun admin -->
        <div v-if="isAdmin" id="adminButtons">
            <button id="addRecordButton">Tilføj plade</button>
            <button id="editRecordButton">Ret plade</button>
            <button id="deleteRecordButton">Slet plade</button>
        </div>

        <table id="recordsTable">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Title</th>
                    <th>Artist</th>
                    <th>Duration</th>
                    <th>Year</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="record in records" :key="record.id">
                    <td>{{ record.id }}</td>
                    <td>{{ record.title }}</td>
                    <td>{{ record.artist }}</td>
                    <td>{{ record.duration }}</td>
                    <td>{{ record.publicationYear }}</td>
                </tr>
            </tbody>
        </table>
    </div>
    <script src="App.js"></script>
</body>
</html>
