<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DR Music Records</title>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios@1.7.9/dist/axios.min.js"></script>
</head>

<body>
<div id="app">
    <h1>Plader</h1>

    <p>{{ message }}</p>

    
  <div id = "app">
  <h1>Søg plader</h1>
  <input id="searchTitle" v-model="searchTitle" placeholder="Titel" @keyup.enter="search" />
  <input id="searchArtist" v-model="searchArtist" placeholder="Kunstner" @keyup.enter="search" />
  <button id="searchButton" @click="search">Søg</button>
  <button id="clearButton" @click="clearSearch">Ryd</button>
  <p id="noRecordsMessage" v-if="records.length === 0 && searched">Ingen plader fundet</p>

 
    <h1>Plader</h1>
      <h2>Tilføj en plade</h2>

      <form @submit.prevent="addRecord">
          <label>Titel:</label>
          <input type="text" v-model="newRecord.title" required>

          <label>Kunstner:</label>
          <input type="text" v-model="newRecord.artist" required>

          <label>Varighed (sekunder):</label>
          <input type="number" v-model.number="newRecord.duration" min="1" required>

          <label>Udgivelsesår:</label>
          <input type="number" v-model.number="newRecord.publicationYear" min="1900" required>

          <button type="submit">Tilføj plade</button>
      </form>

      <p>{{ message }}</p>
      
    <table id = "recordsTable">
        <thead>
        <tr>
            <th>Id</th>
            <th>Title</th>
            <th>Artist</th>
            <th>Duration</th>
            <th>Year</th>
            <th>Handling</th>
        </tr>
        </thead>

        <tbody>
        <tr v-for="record in records" :key="record.id">
            <td>{{ record.id }}</td>
            <td>{{ record.title }}</td>
            <td>{{ record.artist }}</td>
            <td>{{ record.duration }}</td>
            <td>{{ record.publicationYear }}</td>
            <td>
                <button
                        type="button"
                        :data-record-id="record.id"
                        @click="deleteRecord(record.id)">
                    Slet
                </button>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="App.js"></script>
</body>
</html>
